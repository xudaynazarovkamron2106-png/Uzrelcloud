<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Uzrel Messenger — 35 Edition</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#030508;
    --panel:rgba(10,15,24,.72);
    --panel2:rgba(15,22,34,.82);
    --line:rgba(255,255,255,.09);
    --text:#f7faff;
    --muted:#8290a5;
    --blue:#38bdf8;
    --cyan:#22d3ee;
    --purple:#8b5cf6;
    --pink:#ec4899;
    --green:#22c55e;
    --amber:#f59e0b;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Plus Jakarta Sans',sans-serif;
    background:#000;
    color:var(--text);
}

body{
    background:
        radial-gradient(circle at 10% 10%,rgba(56,189,248,.13),transparent 30%),
        radial-gradient(circle at 90% 15%,rgba(139,92,246,.14),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(236,72,153,.09),transparent 35%),
        #020407;
}

/* =========================
   BACKGROUND
========================= */

.bg-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
    z-index:0;
    opacity:.25;
    animation:floatOrb 12s ease-in-out infinite;
}

.orb1{
    width:320px;
    height:320px;
    background:#06b6d4;
    left:-100px;
    top:-100px;
}

.orb2{
    width:280px;
    height:280px;
    background:#7c3aed;
    right:-80px;
    top:20%;
    animation-delay:-4s;
}

.orb3{
    width:260px;
    height:260px;
    background:#ec4899;
    left:30%;
    bottom:-140px;
    animation-delay:-7s;
}

@keyframes floatOrb{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(30px,-20px,0) scale(1.12)}
}

/* =========================
   GLASS
========================= */

.glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
    backdrop-filter:blur(28px) saturate(150%);
    -webkit-backdrop-filter:blur(28px) saturate(150%);
    border:1px solid var(--line);
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.06);
}

.glass-heavy{
    background:rgba(4,8,14,.82);
    backdrop-filter:blur(35px);
    -webkit-backdrop-filter:blur(35px);
    border:1px solid rgba(255,255,255,.09);
}

.neon-border{
    position:relative;
}

.neon-border::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1px;
    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(34,211,238,.55),
            rgba(139,92,246,.55),
            rgba(236,72,153,.45),
            transparent
        );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    opacity:.7;
}

/* =========================
   BUTTONS
========================= */

.modern-btn{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(15px);
    color:#dbeafe;
    border-radius:16px;
    transition:.22s ease;
    position:relative;
    overflow:hidden;
}

.modern-btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
    );
    transform:translateX(-100%);
    transition:.5s;
}

.modern-btn:hover::after{
    transform:translateX(100%);
}

.modern-btn:hover{
    transform:translateY(-2px);
    border-color:rgba(56,189,248,.35);
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.modern-btn:active{
    transform:scale(.96);
}

.circle-btn{
    width:42px;
    height:42px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.gradient-btn{
    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb 45%,
            #7c3aed 75%,
            #ec4899
        );
    box-shadow:
        0 8px 30px rgba(37,99,235,.35),
        inset 0 1px rgba(255,255,255,.25);
    border:1px solid rgba(255,255,255,.16);
}

/* =========================
   LOGO
========================= */

.logo3d{
    width:48px;
    height:48px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb 45%,
            #7c3aed,
            #ec4899
        );
    box-shadow:
        0 15px 40px rgba(37,99,235,.35),
        inset 0 1px rgba(255,255,255,.4);
    transform:perspective(500px) rotateX(5deg) rotateY(-5deg);
}

.logo3d i{
    font-size:20px;
    color:white;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
}

.logo35{
    position:absolute;
    right:-8px;
    bottom:-7px;
    font-size:8px;
    font-weight:900;
    padding:3px 5px;
    border-radius:7px;
    background:linear-gradient(135deg,#f59e0b,#ef4444);
    border:2px solid #030508;
}

/* =========================
   STORIES
========================= */

.story-scroll{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:4px 2px 9px;
}

.story-scroll::-webkit-scrollbar{
    display:none;
}

.story-card{
    min-width:67px;
    width:67px;
    cursor:pointer;
    text-align:center;
}

.story-ring{
    width:58px;
    height:58px;
    margin:auto;
    padding:2px;
    border-radius:19px;
    background:
        conic-gradient(
            #22d3ee,
            #8b5cf6,
            #ec4899,
            #f59e0b,
            #22d3ee
        );
    box-shadow:0 8px 25px rgba(56,189,248,.16);
}

.story-inner{
    width:100%;
    height:100%;
    border-radius:17px;
    background:#080c13;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:2px solid #05080d;
}

.story-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.story-name{
    font-size:8px;
    margin-top:5px;
    color:#aab5c5;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================
   CHAT LIST
========================= */

.chat-item{
    margin:5px 8px;
    padding:10px;
    border-radius:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:11px;
    transition:.2s;
    border:1px solid transparent;
}

.chat-item:hover{
    background:rgba(255,255,255,.045);
    transform:translateX(2px);
}

.chat-item.active{
    background:
        linear-gradient(
            110deg,
            rgba(34,211,238,.13),
            rgba(99,102,241,.09),
            rgba(236,72,153,.06)
        );
    border-color:rgba(56,189,248,.16);
    box-shadow:
        inset 3px 0 #22d3ee,
        0 8px 30px rgba(0,0,0,.18);
}

.avatar{
    width:48px;
    height:48px;
    flex-shrink:0;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:18px;
    font-weight:800;
    color:white;
    background:
        linear-gradient(
            135deg,
            #0891b2,
            #2563eb,
            #7c3aed,
            #ec4899
        );
    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.22);
    transform:perspective(400px) rotateX(2deg);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   CHAT
========================= */

.chat-background{
    background:
        radial-gradient(circle at 20% 20%,rgba(34,211,238,.045),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(139,92,246,.055),transparent 25%),
        radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:auto,auto,26px 26px;
}

.message-row{
    display:flex;
    margin:6px 0;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.bubble{
    max-width:min(560px,78%);
    padding:10px 13px;
    border-radius:20px;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    word-break:break-word;
}

.bubble.me{
    margin-left:auto;
    background:
        linear-gradient(
            135deg,
            rgba(14,165,233,.82),
            rgba(79,70,229,.82),
            rgba(124,58,237,.82)
        );
    border:1px solid rgba(255,255,255,.14);
    border-bottom-right-radius:6px;
}

.bubble.other{
    background:rgba(20,28,42,.84);
    border:1px solid rgba(255,255,255,.075);
    border-bottom-left-radius:6px;
}

.msg-time{
    font-size:8px;
    opacity:.58;
    text-align:right;
    margin-top:4px;
}

/* =========================
   STICKERS
========================= */

.sticker-panel{
    position:absolute;
    bottom:85px;
    left:15px;
    width:300px;
    max-height:300px;
    padding:12px;
    border-radius:22px;
    display:none;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    z-index:50;
}

.sticker-panel.open{
    display:grid;
    animation:pop .18s ease;
}

.sticker{
    height:55px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    cursor:pointer;
    transition:.18s;
}

.sticker:hover{
    transform:scale(1.12) rotate(-3deg);
    background:rgba(56,189,248,.1);
}

@keyframes pop{
    from{opacity:0;transform:translateY(10px) scale(.96)}
    to{opacity:1;transform:none}
}

/* =========================
   BOT KEYBOARD
========================= */

.bot-keyboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:9px;
}

.bot-key{
    border:1px solid rgba(56,189,248,.22);
    background:rgba(34,211,238,.06);
    color:#67e8f9;
    padding:8px 7px;
    border-radius:10px;
    font-size:9px;
    font-weight:700;
    cursor:pointer;
    transition:.18s;
}

.bot-key:hover{
    background:rgba(34,211,238,.14);
    transform:translateY(-1px);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(16px);
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(470px,100%);
    max-height:90vh;
    overflow-y:auto;
    padding:20px;
    border-radius:28px;
    position:relative;
}

.field{
    width:100%;
    padding:12px 14px;
    border-radius:15px;
    outline:none;
    color:white;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.08);
    font-size:12px;
}

.field:focus{
    border-color:rgba(34,211,238,.55);
    box-shadow:0 0 0 3px rgba(34,211,238,.06);
}

/* =========================
   EMPTY STATE
========================= */

.empty-orb{
    width:120px;
    height:120px;
    border-radius:40px;
    margin:auto;
    background:
        radial-gradient(circle at 35% 25%,#67e8f9,transparent 13%),
        linear-gradient(135deg,#0891b2,#2563eb,#7c3aed,#ec4899);
    box-shadow:
        0 30px 80px rgba(37,99,235,.28),
        inset 0 2px 8px rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:perspective(500px) rotateX(12deg) rotateY(-12deg);
    animation:orb3d 5s ease-in-out infinite;
}

.empty-orb i{
    font-size:43px;
    color:white;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,.4));
}

@keyframes orb3d{
    0%,100%{transform:perspective(500px) rotateX(12deg) rotateY(-12deg) translateY(0)}
    50%{transform:perspective(500px) rotateX(-8deg) rotateY(14deg) translateY(-10px)}
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){
    .mobile-hide{
        display:none!important;
    }

    .bubble{
        max-width:84%;
    }

    .sticker-panel{
        left:8px;
        right:8px;
        width:auto;
    }
}

::-webkit-scrollbar{
    width:5px;
    height:5px;
}

::-webkit-scrollbar-thumb{
    background:rgba(148,163,184,.18);
    border-radius:20px;
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<canvas id="confettiCanvas"
style="position:fixed;inset:0;pointer-events:none;z-index:9999"></canvas>

<!-- ================= AUTH ================= -->

<section id="authScreen"
class="fixed inset-0 z-[100] flex items-center justify-center p-5"
style="background:rgba(0,0,0,.88);backdrop-filter:blur(30px)">

    <div class="glass neon-border modal-box" style="max-width:430px">

        <div class="flex justify-center mb-5">
            <div class="logo3d">
                <i class="fa-solid fa-cube"></i>
                <span class="logo35">35</span>
            </div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-tight">
                <span style="
                background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#f59e0b);
                -webkit-background-clip:text;
                color:transparent">
                    Uzrel
                </span>
            </h1>

            <p class="text-xs text-slate-400 mt-2">
                35 Yillik maxsus nashr
            </p>
        </div>

        <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-black/30 mb-5">

            <button id="loginTab"
            onclick="switchAuth('login')"
            class="modern-btn py-2.5 text-xs font-bold"
            style="background:rgba(37,99,235,.5)">
                Kirish
            </button>

            <button id="registerTab"
            onclick="switchAuth('register')"
            class="modern-btn py-2.5 text-xs font-bold">
                Ro'yxatdan o'tish
            </button>

        </div>

        <div id="authError"
        class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-xs text-center">
        </div>

        <input
        id="usernameInput"
        class="field mb-3"
        placeholder="Username">

        <input
        id="birthInput"
        type="date"
        class="field mb-3 hidden">

        <input
        id="passwordInput"
        type="password"
        class="field mb-4"
        placeholder="Parol">

        <button
        onclick="handleAuth()"
        class="gradient-btn w-full py-3.5 rounded-2xl font-bold text-xs">
            <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i>
            <span id="authButtonText">Kirish</span>
        </button>

        <p class="text-[9px] text-slate-500 text-center mt-5">
            Demo messenger • Uzrel
        </p>
    </div>
</section>


<!-- ================= APP ================= -->

<section id="appScreen" class="hidden w-full h-full relative z-10">

    <!-- TOP BAR -->

    <div class="h-9 flex items-center justify-between px-3 sm:px-5
    bg-black/50 border-b border-white/5 backdrop-blur-xl">

        <div class="flex items-center gap-2 min-w-0">

            <span class="px-2 py-1 rounded-full text-[8px] font-black
            bg-gradient-to-r from-cyan-500 via-blue-500 to-pink-500">
                35 YILLIK
            </span>

            <span class="text-[9px] text-slate-400 truncate">
                Uzrel Messenger
            </span>

        </div>

        <button
        onclick="fireworks()"
        class="text-[9px] text-amber-300 hover:text-white transition">
            <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>
            Effekt
        </button>

    </div>


    <div class="w-full h-[calc(100%-36px)] flex">

        <!-- ================= SIDEBAR ================= -->

        <aside
        id="sidebar"
        class="w-full sm:w-[390px] h-full glass-heavy border-r border-white/5 flex flex-col">

            <!-- PROFILE -->

            <div class="p-3 border-b border-white/5">

                <div class="flex items-center gap-3">

                    <div id="myAvatar"
                    class="avatar cursor-pointer"
                    onclick="openSettings()">
                        K
                    </div>

                    <div class="flex-1 min-w-0">

                        <div id="myName"
                        class="font-extrabold text-xs truncate">
                            User
                        </div>

                        <div id="myUsername"
                        class="text-[9px] text-cyan-400 truncate">
                            @user
                        </div>

                    </div>

                    <button
                    onclick="openSettings()"
                    class="modern-btn circle-btn"
                    title="Sozlamalar">

                        <i class="fa-solid fa-sliders text-xs"></i>

                    </button>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="p-3 pb-2">

                <div class="relative">

                    <i class="fa-solid fa-magnifying-glass
                    absolute left-4 top-1/2 -translate-y-1/2
                    text-slate-500 text-xs"></i>

                    <input
                    id="searchInput"
                    oninput="renderChats()"
                    class="field pl-10 rounded-full"
                    placeholder="Chatlar, do'stlar, guruhlar...">

                </div>

            </div>


            <!-- STORIES -->

            <div class="px-3 pb-2">

                <div class="flex justify-between items-center mb-1">

                    <span class="text-[9px] font-extrabold uppercase tracking-wider text-slate-500">
                        Hikoyalar
                    </span>

                    <button
                    onclick="openStoryModal('user')"
                    class="text-[9px] text-cyan-400">
                        + Hikoya
                    </button>

                </div>

                <div id="storyList" class="story-scroll"></div>

            </div>


            <!-- PEOPLE -->

            <div class="px-3 pb-2 relative">

                <button
                onclick="togglePeopleMenu()"
                class="modern-btn w-full py-3 px-4 flex items-center gap-3">

                    <span class="w-9 h-9 rounded-xl
                    bg-gradient-to-br from-cyan-500/30 to-purple-500/30
                    flex items-center justify-center">
                        <i class="fa-solid fa-user-group text-cyan-300 text-xs"></i>
                    </span>

                    <span class="flex-1 text-left">
                        <span class="block text-[10px] font-extrabold">
                            Do'stlar & Guruhlar
                        </span>
                        <span class="block text-[8px] text-slate-500">
                            Odamlar va jamoalarni boshqarish
                        </span>
                    </span>

                    <i class="fa-solid fa-chevron-down text-[9px] text-slate-500"></i>

                </button>

                <div
                id="peopleMenu"
                class="hidden glass absolute left-3 right-3 top-[60px] z-40 p-2 rounded-2xl">

                    <button
                    onclick="openAddFriend();hidePeopleMenu()"
                    class="modern-btn w-full p-3 flex gap-3 items-center mb-1">

                        <span>➕</span>
                        <span class="text-[10px] font-bold">Do'st qo'shish</span>

                    </button>

                    <button
                    onclick="openCreate('group');hidePeopleMenu()"
                    class="modern-btn w-full p-3 flex gap-3 items-center mb-1">

                        <span>👥</span>
                        <span class="text-[10px] font-bold">Guruh yaratish</span>

                    </button>

                    <button
                    onclick="openCreate('channel');hidePeopleMenu()"
                    class="modern-btn w-full p-3 flex gap-3 items-center">

                        <span>📢</span>
                        <span class="text-[10px] font-bold">Kanal yaratish</span>

                    </button>

                </div>

            </div>


            <!-- FILTERS -->

            <div class="px-3 py-1 flex gap-2 overflow-x-auto"
            id="filters">

                <button onclick="setFolder('all',this)"
                class="modern-btn px-3 py-1.5 text-[9px] font-bold">
                    Barchasi
                </button>

                <button onclick="setFolder('friend',this)"
                class="modern-btn px-3 py-1.5 text-[9px] font-bold">
                    Do'stlar
                </button>

                <button onclick="setFolder('group',this)"
                class="modern-btn px-3 py-1.5 text-[9px] font-bold">
                    Guruhlar
                </button>

                <button onclick="setFolder('channel',this)"
                class="modern-btn px-3 py-1.5 text-[9px] font-bold">
                    Kanallar
                </button>

                <button onclick="setFolder('bots',this)"
                class="modern-btn px-3 py-1.5 text-[9px] font-bold">
                    Botlar
                </button>

            </div>


            <!-- CHAT LIST -->

            <div
            id="chatList"
            class="flex-1 overflow-y-auto px-1 py-1">
            </div>

        </aside>


        <!-- ================= CHAT ================= -->

        <main
        id="chatPanel"
        class="hidden sm:flex flex-1 h-full flex-col relative chat-background">

            <!-- HEADER -->

            <header
            class="glass px-3 sm:px-5 py-2.5 flex items-center gap-3 border-b border-white/5">

                <button

<script>

/* ============================================================
   FIREBASE
============================================================ */

const firebaseConfig = {
    apiKey: "AIzaSyDummyKeyForCompatModeToWork",
    authDomain: "uzrel-ceeed.firebaseapp.com",
    databaseURL: "https://uzrel-ceeed-default-rtdb.firebaseio.com",
    projectId: "uzrel-ceeed",
    storageBucket: "uzrel-ceeed.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:0000000000000000"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* ============================================================
   STATE
============================================================ */

let currentUser =
    localStorage.getItem("uzrel_current_user") || null;

let activeUserData = null;
let activeChatId = null;
let authMode = "login";
let currentFolder = "all";
let allUsers = {};
let globalChats = {};
let storyTarget = "user";


/* ============================================================
   INIT
============================================================ */

window.addEventListener("load",()=>{

    if(currentUser){

        startFirebase();

    }

});


/* ============================================================
   AUTH
============================================================ */

function switchAuth(mode){

    authMode = mode;

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const birth =
        document.getElementById("birthInput");

    const text =
        document.getElementById("authButtonText");

    if(mode==="login"){

        loginTab.style.background =
            "rgba(37,99,235,.5)";

        registerTab.style.background =
            "rgba(255,255,255,.045)";

        birth.classList.add("hidden");

        text.textContent="Kirish";

    }else{

        registerTab.style.background =
            "rgba(37,99,235,.5)";

        loginTab.style.background =
            "rgba(255,255,255,.045)";

        birth.classList.remove("hidden");

        text.textContent="Ro'yxatdan o'tish";

    }

}


function showAuthError(text){

    const box =
        document.getElementById("authError");

    box.textContent=text;

    box.classList.remove("hidden");

}


function handleAuth(){

    const username =
        document.getElementById("usernameInput")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("passwordInput")
        .value;

    const birth =
        document.getElementById("birthInput")
        .value;

    if(!username || !password){

        showAuthError(
            "Username va parolni kiriting."
        );

        return;

    }

    if(!/^[a-z0-9_]{3,24}$/.test(username)){

        showAuthError(
            "Username faqat a-z, 0-9 va _ dan iborat bo'lsin."
        );

        return;

    }

    db.ref("users/"+username)
    .once("value")
    .then(snapshot=>{

        const user = snapshot.val();

        if(authMode==="login"){

            if(!user){

                showAuthError(
                    "Bunday akkaunt topilmadi."
                );

                return;

            }

            if(user.password!==password){

                showAuthError(
                    "Parol noto'g'ri."
                );

                return;

            }

        }else{

            if(!birth){

                showAuthError(
                    "Tug'ilgan kunni kiriting."
                );

                return;

            }

            if(user){

                showAuthError(
                    "Bu username band."
                );

                return;

            }

            const data = {

                password:password,
                birthdate:birth,

                displayName:
                    username.charAt(0).toUpperCase()+
                    username.slice(1),

                avatar:
                    username.charAt(0).toUpperCase(),

                bio:"Uzrel foydalanuvchisi",

                chats:{

                    saved_messages:{

                        id:"saved_messages",
                        name:"Saqlangan xabarlar",
                        type:"saved",
                        icon:"🔖",

                        messages:{

                            welcome:{
                                sender:"other",
                                type:"text",
                                text:"Uzrel'ga xush kelibsiz! 🎉",
                                time:now()
                            }

                        }

                    },

                    bot_father:{

                        id:"bot_father",
                        name:"Uzrel BotFather",
                        type:"bots",
                        icon:"🤖",

                        messages:{

                            welcome:{
                                sender:"other",
                                type:"text",
                                text:"Bot boshqaruvi uchun quyidagi tugmalardan foydalaning.",
                                time:now(),
                                keyboard:true
                            }

                        }

                    }

                }

            };

            return db.ref(
                "users/"+username
            ).set(data);

        }

    })
    .then(()=>{

        currentUser=username;

        localStorage.setItem(
            "uzrel_current_user",
            username
        );

        startFirebase();

    })
    .catch(error=>{

        showAuthError(
            "Firebase xatosi: "+error.message
        );

    });

}


/* ============================================================
   FIREBASE LISTENERS
============================================================ */

function startFirebase(){

    db.ref("users").on("value",snapshot=>{

        allUsers =
            snapshot.val() || {};

        if(!allUsers[currentUser]){

            logout();

            return;

        }

        activeUserData =
            allUsers[currentUser];

        document
        .getElementById("authScreen")
        .style.display="none";

        document
        .getElementById("appScreen")
        .classList.remove("hidden");

        renderProfile();
        renderStories();
        renderChats();

        if(activeChatId){

            renderMessages();

        }

    });


    db.ref("globalChats").on("value",snapshot=>{

        globalChats =
            snapshot.val() || {};

        renderChats();

        if(activeChatId){

            renderMessages();

        }

    });

}


/* ============================================================
   PROFILE
============================================================ */

function renderProfile(){

    if(!activeUserData) return;

    document.getElementById("myName")
    .textContent =
        activeUserData.displayName ||
        currentUser;

    document.getElementById("myUsername")
    .textContent =
        "@"+currentUser;

    setAvatar(
        document.getElementById("myAvatar"),
        activeUserData.avatar ||
        currentUser[0].toUpperCase()
    );

}


function setAvatar(el,value){

    el.innerHTML="";

    if(typeof value==="string" &&
       value.startsWith("data:image")){

        const img=document.createElement("img");

        img.src=value;

        el.appendChild(img);

    }else{

        el.textContent=value || "U";

    }

}


/* ============================================================
   FOLDERS
============================================================ */

function setFolder(folder,button){

    currentFolder=folder;

    document
    .querySelectorAll("#filters button")
    .forEach(b=>{
        b.style.background="rgba(255,255,255,.045)";
    });

    button.style.background=
        "rgba(37,99,235,.35)";

    renderChats();

}


/* ============================================================
   CHATS
============================================================ */

function getChats(){

    return activeUserData &&
           activeUserData.chats
           ? activeUserData.chats
           : {};

}


function renderChats(){

    const list =
        document.getElementById("chatList");

    if(!list || !activeUserData) return;

    list.innerHTML="";

    const search =
        (document.getElementById("searchInput")
        ?.value || "")
        .toLowerCase()
        .trim();

    Object.values(getChats())
    .filter(chat=>{

        if(search &&
        !chat.name.toLowerCase().includes(search)){

            return false;

        }

        if(currentFolder!=="all" &&
           chat.type!==currentFolder){

            return false;

        }

        return true;

    })
    .forEach(chat=>{

        const div =
            document.createElement("div");

        div.className =
            "chat-item "+
            (activeChatId===chat.id
            ?"active":"");

        const avatar =
            document.createElement("div");

        avatar.className="avatar";

        setAvatar(
            avatar,
            chat.icon ||
            chat.name[0].toUpperCase()
        );

        const body =
            document.createElement("div");

        body.className=
            "flex-1 min-w-0";

        const title =
            document.createElement("div");

        title.className=
            "font-extrabold text-xs truncate";

        title.textContent=chat.name;

        const preview =
            document.createElement("div");

        preview.className=
            "text-[9px] text-slate-500 truncate mt-1";

        preview.textContent=
            getLastMessage(chat);

        body.appendChild(title);
        body.appendChild(preview);

        div.appendChild(avatar);
        div.appendChild(body);

        div.onclick=()=>{
            selectChat(chat.id);
        };

        list.appendChild(div);

    });

}


function getLastMessage(chat){

    let messages=[];

    if(chat.type==="friend"){

        const room=
            roomKey(
                currentUser,
                chat.targetUser
            );

        messages=
            globalChats[room]
            ?Object.values(globalChats[room])
            :[];

    }else{

        messages=
            chat.messages
            ?Object.values(chat.messages)
            :[];

    }

    if(!messages.length){

        return "Xabarlar yo'q";

    }

    const m=
        messages[messages.length-1];

    if(m.type==="image")
        return "📷 Rasm";

    if(m.type==="sticker")
        return "Sticker "+m.text;

    return m.text || "";

}


/* ============================================================
   SELECT CHAT
============================================================ */

function selectChat(id){

    const chat=getChats()[id];

    if(!chat) return;

    activeChatId=id;

    document
    .getElementById("chatPanel")
    .classList.remove("hidden");

    document
    .getElementById("sidebar")
    .classList.add("mobile-hide");

    document
    .getElementById("activeTitle")
    .textContent=chat.name;

    document
    .getElementById("activeSubtitle")
    .textContent=
        chat.type==="friend"
        ?"Onlayn do'st"
        :chat.type==="bots"
        ?"Bot"
        :chat.type==="group"
        ?"Guruh"
        :"Kanal";

    setAvatar(
        document.getElementById("activeAvatar"),
        chat.icon || chat.name[0].toUpperCase()
    );

    renderMessages();
    renderChats();

}


function backToSidebar(){

    document
    .getElementById("sidebar")
    .classList.remove("mobile-hide");

    document
    .getElementById("chatPanel")
    .classList.add("hidden");

}


/* ============================================================
   MESSAGE RENDER
============================================================ */

function getMessages(chat){

    if(chat.type==="friend"){

        const room=
            roomKey(
                currentUser,
                chat.targetUser
            );

        return globalChats[room]
        ?Object.values(globalChats[room])
        :[];

    }

    return chat.messages
    ?Object.values(chat.messages)
    :[];

}


function renderMessages(){

    const box =
        document.getElementById(
            "messageContainer"
        );

    box.innerHTML="";

    if(!activeChatId){

        showEmptyState();

        return;

    }

    const chat=getChats()[activeChatId];

    if(!chat){

        showEmptyState();

        return;

    }

    const messages=getMessages(chat);

    if(!messages.length){

        showEmptyState();

        return;

    }

    messages.forEach(m=>{

        const row=
            document.createElement("div");

        row.className="message-row";

        const bubble=
            document.createElement("div");

        const me =
            m.sender===currentUser ||
            m.sender==="me";

        bubble.className=
            "bubble "+
            (me?"me":"other");

        if(m.type==="image"){

            const img=
                document.createElement("img");

            img.src=m.text;

            img.className=
                "max-w-full max-h-72 rounded-xl object-cover";

            bubble.appendChild(img);

        }else if(m.type==="sticker"){

            const sticker=
                document.createElement("div");

            sticker.textContent=m.text;

            sticker.style.fontSize="48px";

            sticker.style.textAlign="center";

            bubble.appendChild(sticker);

        }else{

            const text=
                document.createElement("div");

            text.textContent=m.text || "";

            text.className="text-xs leading-relaxed";

            bubble.appendChild(text);

        }

        if(m.keyboard){

            bubble.appendChild(
                createBotKeyboard()
            );

        }

        if(m.time){

            const time=
                document.createElement("div");

            time.className="msg-time";

            time.textContent=m.time;

            bubble.appendChild(time);

        }

        row.appendChild(bubble);

        box.appendChild(row);

    });

    box.scrollTop=box.scrollHeight;

}


function showEmptyState(){

    const box =
        document.getElementById(
            "messageContainer"
        );

    box.innerHTML=`

        <div class="h-full flex flex-col items-center justify-center text-center">

            <div class="empty-orb mb-6">
                <i class="fa-solid fa-message"></i>
            </div>

            <h2 class="font-black text-lg">
                Uzrel Messenger
            </h2>

            <p class="text-[10px] text-slate-500 mt-2">
                Chatni tanlang va suhbatni boshlang.
            </p>

        </div>

    `;

}


/* ============================================================
   SEND MESSAGE
============================================================ */

function sendMessage(){

    const input=
        document.getElementById("msgInput");

    const text=input.value.trim();

    if(!text || !activeChatId)
        return;

    if(processUzreo(text)){

        input.value="";

        return;

    }

    if(
        text.toLowerCase().includes("35") ||
        text.toLowerCase().includes("bayram") ||
        text.toLowerCase().includes("muborak")
    ){

        fireworks();

    }

    dispatchMessage({
        type:"text",
        content:text
    });

    input.value="";

}


/* ============================================================
   DISPATCH
============================================================ */

function dispatchMessage(data){

    const chat=
        getChats()[activeChatId];

    if(!chat){

        showToast("Avval chat tanlang.");

        return;

    }

    const message={

        sender:currentUser,

        type:data.type,

        text:data.content,

        time:now()

    };

    let ref;

    if(chat.type==="friend"){

        const room=
            roomKey(
                currentUser,
                chat.targetUser
            );

        ref=
            db.ref(
                "globalChats/"+room
            );

    }else{

        ref=
            db.ref(
                "users/"+currentUser+
                "/chats/"+activeChatId+
                "/messages"
            );

    }

    ref.push(message)
    .then(()=>{

        renderMessages();

        /* BotFather */
        if(
            chat.id==="bot_father" &&
            data.type==="text"
        ){

            botFatherResponse(
                data.content
            );

        }

    })
    .catch(error=>{

        showToast(
            "Xabar yuborilmadi: "+
            error.message
        );

        console.error(error);

    });

}


/* ============================================================
   BOT
============================================================ */

function createBotKeyboard(){

    const wrap=
        document.createElement("div");

    wrap.className="bot-keyboard";

    const buttons=[

        ["➕ Yangi bot","newbot"],
        ["🤖 Mening botlarim","mybots"],
        ["✏️ Nomini o'zgartirish","name"],
        ["🖼️ Rasm o'zgartirish","picture"],
        ["📝 Tavsif","description"],
        ["❓ Yordam","help"]

    ];

    buttons.forEach(([label,action])=>{

        const b=
            document.createElement("button");

        b.className="bot-key";

        b.textContent=label;

        b.onclick=()=>botAction(action);

        wrap.appendChild(b);

    });

    return wrap;

}


function botAction(action){

/* ============================================================
   IMAGE
============================================================ */

function handleImage(event){

    const file=
        event.target.files[0];

    event.target.value="";

    if(!file || !activeChatId)
        return;

    if(!file.type.startsWith("image/")){

        showToast("Faqat rasm yuborish mumkin.");

        return;

    }

    if(file.size>8*1024*1024){

        showToast("Rasm 8 MB dan kichik bo'lsin.");

        return;

    }

    const reader=new FileReader();

    reader.onload=e=>{

        compressImage(
            e.target.result,
            1400,
            0.82,
            dataUrl=>{

                dispatchMessage({

                    type:"image",
                    content:dataUrl

                });

            }
        );

    };

    reader.readAsDataURL(file);

}


function compressImage(src,maxWidth,quality,done){

    const img=new Image();

    img.onload=()=>{

        const scale=
            Math.min(
                1,
                maxWidth/img.width
            );

        const canvas=
            document.createElement("canvas");

        canvas.width=
            img.width*scale;

        canvas.height=
            img.height*scale;

        const ctx=
            canvas.getContext("2d");

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        done(
            canvas.toDataURL(
                "image/jpeg",
                quality
            )
        );

    };

    img.src=src;

}

function renderStories(){

    const box=
        document.getElementById(
            "storyList"
        );

    if(!box || !activeUserData)
        return;

    box.innerHTML="";


    /* MY STORY */

    const myStories=
        activeUserData.stories
        ?Object.values(activeUserData.stories)
        :[];

    if(myStories.length){

        addStoryCard(
            box,
            activeUserData,
            myStories[myStories.length-1],
            "Siz"
        );

    }


    /* FRIEND STORIES */

    Object.entries(allUsers).forEach(
        ([username,user])=>{

            if(username===currentUser)
                return;

            const stories=
                user.stories
                ?Object.values(user.stories)
                :[];

            if(!stories.length)
                return;

            addStoryCard(
                box,
                user,
                stories[stories.length-1],
                user.displayName || username
            );

        }
    );


    /* GROUP STORIES */

    Object.values(getChats())
    .filter(c=>c.type==="group" && c.story)
    .forEach(group=>{

        addStoryCard(
            box,
            group,
            group.story,
            group.name
        );

    });

}


function addStoryCard(box,owner,story,name){

    const card=
        document.createElement("div");

    card.className="story-card";

    const ring=
        document.createElement("div");

    ring.className="story-ring";

    const inner=
        document.createElement("div");

    inner.className="story-inner";

    if(story.image){

        const img=
            document.createElement("img");

        img.src=story.image;

        inner.appendChild(img);

    }else{

        inner.textContent=
            owner.avatar || "📖";

    }

    ring.appendChild(inner);

    const title=
        document.createElement("div");

    title.className="story-name";

    title.textContent=name;

    card.appendChild(ring);
    card.appendChild(title);

    card.onclick=()=>{

        viewStory(
            story,
            name
        );

    };

    box.appendChild(card);

}

        new FileReader();

    reader.onload=e=>{

        compressImage(
            e.target.result,
            1200,
            .82,
            image=>{

                const story={

                    image:image,

                    caption:caption,

============================================================ */

function processUzreo(text){

    const lower=
        text.toLowerCase().trim();

    if(!lower.startsWith("/uzreo"))
        return false;

    const command=
        lower
        .replace("/uzreo","")
        .trim();

    if(command==="help" || !command){

        sendInvisibleUzreo(
            "Uzreo: /uzreo dark, /uzreo amoled, /uzreo fireworks, /uzreo stickers, /uzreo settings"
        );

    }else if(command==="dark"){

        document.body.style.backgroundColor="#020407";

        sendInvisibleUzreo(
            "Uzreo: dark mode kuchaytirildi."
        );

    }else if(command==="amoled"){

        document.body.style.background="#000";

        sendInvisibleUzreo(
            "Uzreo: AMOLED qora rejim yoqildi."
        );

    }else if(command==="fireworks"){

        fireworks();

        sendInvisibleUzreo(
            "Uzreo: effekt ishga tushdi."
        );

    }else if(command==="stickers"){

        toggleStickers();

    }else if(command==="settings"){

        openSettings();

    }else{

        sendInvisibleUzreo(
            "Uzreo: bu buyruq hozircha mavjud emas."
        );

    }

    return true;

}


function sendInvisibleUzreo(text){

    if(!activeChatId)
        return;

    const chat=
        getChats()[activeChatId];

    if(!chat)
        return;

    const message={

        sender:"other",

        type:"text",

        text:text,

        time:now()

    };

    if(chat.type==="friend"){

        const room=
            roomKey(
                currentUser,
                chat.targetUser
            );

        db.ref(
            "globalChats/"+room
        ).push(message);

    }else{

        db.ref(
            "users/"+currentUser+
            "/chats/"+activeChatId+
            "/messages"
        ).push(message);

    }

}


/* ============================================================

============================================================ */

function fireworks(){

    const canvas=
        document.getElementById(
            "confettiCanvas"
        );

    const fire=
        confetti.create(
            canvas,
            {
                resize:true,
                useWorker:true
            }
        );

    const colors=[
        "#22d3ee",
        "#3b82f6",
        "#8b5cf6",
        "#ec4899",
        "#f59e0b",
        "#22c55e",
        "#ffffff"
    ];

    fire({

        particleCount:100,

        spread:110,

        startVelocity:45,

        origin:{
            y:.65
        },

        colors:colors

    });

    setTimeout(()=>{

        fire({

            particleCount:70,

            angle:60,

            spread:70,

            origin:{
                x:0,
                y:.6
            },

            colors:colors

        });

        fire({

            particleCount:70,

            angle:120,

            spread:70,

            origin:{
                x:1,
                y:.6
            },

            colors:colors

        });

    },350);

}


/* ============================================================
   UTILS
============================================================ */

function roomKey(a,b){

    return [a,b]
    .sort()
    .join("_");

}


function now(){

    return new Date()
    .toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function showToast(text){

    const toast=
        document.createElement("div");

    toast.className=
        "fixed bottom-6 left-1/2 -translate-x-1/2 z-[10000]"+
        " glass px-4 py-3 rounded-2xl"+
        " text-[10px] font-bold text-white";

    toast.textContent=text;

    document.body.appendChild(toast);

    setTimeout(()=>{

        toast.style.opacity="0";
        toast.style.transform=
            "translate(-50%,10px)";

        toast.style.transition=".3s";

        setTimeout(
            ()=>toast.remove(),
            300
        );

    },2600);

}
