<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Uzrel Messenger</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

:root{
    --bg:#05070c;
    --panel:rgba(14,18,29,.72);
    --panel2:rgba(20,25,39,.82);
    --line:rgba(255,255,255,.08);
    --text:#f7f9ff;
    --muted:#8791a8;
    --blue:#4f8cff;
    --cyan:#26d9ff;
    --purple:#9b5cff;
    --pink:#ff4fd8;
    --green:#26e59b;
}

body{
    margin:0;
    overflow:hidden;
    font-family:'Plus Jakarta Sans',sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(79,140,255,.16),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(155,92,255,.14),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(38,217,255,.08),transparent 35%),
        var(--bg);
    color:var(--text);
}

button,input{
    font-family:inherit;
}

::-webkit-scrollbar{
    width:5px;
}
::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.13);
    border-radius:20px;
}

/* =========================
   BACKGROUND
========================= */

.aurora{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.18;
    pointer-events:none;
    animation:floatAurora 12s infinite alternate ease-in-out;
}

.aurora.a{
    background:#356dff;
    left:-150px;
    top:-150px;
}

.aurora.b{
    background:#c33dff;
    right:-170px;
    bottom:-170px;
    animation-delay:-4s;
}

@keyframes floatAurora{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(70px,35px) scale(1.2)}
}

/* =========================
   GLASS
========================= */

.glass{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );
    border:1px solid var(--line);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.glass-btn{
    border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.045);
    color:#aeb8ca;
    transition:.25s;
    backdrop-filter:blur(15px);
}

.glass-btn:hover{
    transform:translateY(-2px) scale(1.04);
    color:white;
    border-color:rgba(79,140,255,.45);
    background:rgba(79,140,255,.12);
    box-shadow:0 10px 30px rgba(79,140,255,.16);
}

.glass-btn:active{
    transform:scale(.94);
}

/* =========================
   3D LOGO
========================= */

.logo3d{
    position:relative;
    width:48px;
    height:48px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        linear-gradient(145deg,#3d7cff,#7b43ff 50%,#16d9ff);
    box-shadow:
        0 15px 35px rgba(79,140,255,.35),
        inset 0 2px 4px rgba(255,255,255,.35);
    transform:perspective(500px) rotateX(7deg) rotateY(-7deg);
}

.logo3d:after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.25);
}

.logo3d i{
    position:relative;
    z-index:2;
}

/* =========================
   STORIES
========================= */

.story-strip{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:10px 4px 12px;
}

.story-strip::-webkit-scrollbar{
    display:none;
}

.story{
    flex:0 0 66px;
    text-align:center;
    cursor:pointer;
}

.story-avatar{
    width:58px;
    height:58px;
    margin:auto;
    padding:3px;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        #26d9ff,
        #7c4dff,
        #ff4fd8,
        #ffad42
    );
    box-shadow:0 7px 25px rgba(155,92,255,.25);
}

.story-avatar-inner{
    width:100%;
    height:100%;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#101522;
    overflow:hidden;
    font-size:20px;
}

.story-avatar-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.story-name{
    font-size:9px;
    margin-top:5px;
    color:#aab3c5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.add-story{
    border:1px dashed rgba(79,140,255,.55);
}

/* =========================
   CHAT LIST
========================= */

.chat-item{
    position:relative;
    margin:5px 8px;
    padding:12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border:1px solid transparent;
    transition:.25s;
}

.chat-item:hover{
    transform:translateX(3px);
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.06);
}

.chat-item.active{
    background:
        linear-gradient(
            100deg,
            rgba(79,140,255,.17),
            rgba(155,92,255,.08)
        );
    border-color:rgba(79,140,255,.2);
    box-shadow:
        0 10px 35px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.avatar3d{
    position:relative;
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:white;
    background:linear-gradient(
        145deg,
        #4f8cff,
        #814eff,
        #23d9ff
    );
    box-shadow:
        0 10px 25px rgba(79,140,255,.25),
        inset 0 2px 3px rgba(255,255,255,.25);
}

.online-dot{
    position:absolute;
    width:11px;
    height:11px;
    right:-1px;
    bottom:-1px;
    border:2px solid #101522;
    background:#28e49a;
    border-radius:50%;
}

/* =========================
   MESSAGE
========================= */

.message-row{
    display:flex;
    margin:8px 0;
    animation:messageIn .22s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.message-row.me{
    justify-content:flex-end;
}

.message-bubble{
    max-width:min(70%,520px);
    padding:11px 14px;
    border-radius:20px;
    position:relative;
    box-shadow:0 8px 25px rgba(0,0,0,.16);
}

.message-bubble.other{
    background:rgba(22,28,42,.82);
    border:1px solid rgba(255,255,255,.065);
    border-bottom-left-radius:7px;
}

.message-bubble.me{
    background:
        linear-gradient(
            135deg,
            rgba(61,119,255,.94),
            rgba(116,67,255,.92)
        );
    border-bottom-right-radius:7px;
}

.message-time{
    font-size:8px;
    opacity:.58;
    text-align:right;
    margin-top:4px;
}

/* =========================
   BOT KEYBOARD
========================= */

.bot-keyboard{
    margin-top:9px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:5px;
}

.bot-keyboard button{
    min-height:34px;
    border:1px solid rgba(79,140,255,.2);
    background:rgba(79,140,255,.08);
    color:#69a5ff;
    border-radius:8px;
    font-size:10px;
    font-weight:700;
    transition:.2s;
}

.bot-keyboard button:hover{
    background:rgba(79,140,255,.18);
    color:white;
    transform:translateY(-1px);
}

/* =========================
   STICKERS
========================= */

.sticker-panel{
    position:absolute;
    bottom:86px;
    left:14px;
    width:310px;
    max-width:calc(100vw - 28px);
    padding:12px;
    border-radius:23px;
    display:none;
    z-index:40;
}

.sticker-panel.open{
    display:block;
    animation:pop .18s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.92) translateY(8px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.sticker-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    max-height:210px;
    overflow:auto;
}

.sticker{
    aspect-ratio:1;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.04);
    font-size:27px;
    cursor:pointer;
    transition:.18s;
}

.sticker:hover{
    transform:scale(1.12) rotate(-3deg);
    background:rgba(79,140,255,.13);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(18px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:100;
}

.modal.open{
    display:flex;
}

.modal-card{
    width:min(440px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:28px;
    padding:20px;
}

.field{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.22);
    color:white;
    border-radius:15px;
    padding:11px 13px;
    outline:none;
    font-size:11px;
}

.field:focus{
    border-color:rgba(79,140,255,.6);
    box-shadow:0 0 0 3px rgba(79,140,255,.08);
}

/* =========================
   STORY VIEWER
========================= */

.story-viewer{
    position:fixed;
    inset:0;
    background:#020308;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
}

.story-viewer.open{
    display:flex;
}

.story-view-image{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

.story-close{
    position:absolute;
    top:20px;
    right:20px;
    width:42px;
    height:42px;
    border-radius:50%;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .desktop-only{
        display:none!important;
    }

    #sidebarPanel{
        width:100%;
    }

    .message-bubble{
        max-width:82%;
    }

    .sticker-panel{
        bottom:78px;
    }
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="aurora a"></div>
<div class="aurora b"></div>

<canvas id="confettiCanvas"
style="position:fixed;inset:0;pointer-events:none;z-index:9999"></canvas>

<!-- ================= AUTH ================= -->

<div id="authScreen"
class="fixed inset-0 z-[300] flex items-center justify-center p-4">

    <div class="glass rounded-[32px] p-7 w-full max-w-md">

        <div class="flex justify-center mb-5">
            <div class="logo3d text-white text-xl">
                <i class="fa-solid fa-cube"></i>
            </div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight">
                Uzrel<span class="text-blue-400">.</span>
            </h1>
            <p class="text-xs text-[var(--muted)] mt-2">
                Modern Messenger
            </p>
        </div>

        <div class="glass p-1 rounded-2xl flex mb-5">
            <button id="tabLoginBtn"
            onclick="switchAuthMode('login')"
            class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">
                Kirish
            </button>

            <button id="tabRegisterBtn"
            onclick="switchAuthMode('register')"
            class="flex-1 py-2.5 rounded-xl text-xs font-bold text-[var(--muted)]">
                Ro'yxatdan o'tish
            </button>
        </div>

        <div id="errorMsg"
        class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl p-3 mb-3">
        </div>

        <input id="usernameInput"
        class="field mb-3"
        placeholder="Username">

        <input id="birthdateInput"
        type="date"
        class="field mb-3 hidden">

        <input id="passwordInput"
        type="password"
        class="field mb-4"
        placeholder="Parol">

        <button id="authActionBtn"
        onclick="handleAuth()"
        class="w-full py-3.5 rounded-2xl text-xs font-extrabold text-white
        bg-gradient-to-r from-blue-600 via-purple-600 to-cyan-500
        shadow-lg shadow-blue-500/20">
            Akkauntga kirish
        </button>

    </div>
</div>


<!-- ================= APP ================= -->

<div id="appScreen" class="hidden w-screen h-screen relative">

    <div class="flex h-full">

        <!-- SIDEBAR -->

        <aside id="sidebarPanel"
        class="w-[370px] h-full border-r border-white/5
        bg-black/25 backdrop-blur-3xl flex flex-col">

            <!-- PROFILE TOP -->

            <div class="p-4">

                <div class="glass rounded-[24px] p-3 flex items-center gap-3">

                    <div id="myAvatar"
                    class="avatar3d">
                        K
                        <span class="online-dot"></span>
                    </div>

                    <div class="flex-1 min-w-0">
                        <div id="myName"
                        class="font-extrabold text-xs truncate">
                            User
                        </div>

                        <div id="myUsername"
                        class="text-[10px] text-[var(--muted)]">
                            @user
                        </div>
                    </div>

                    <button onclick="openSettingsModal()"
                    class="glass-btn w-9 h-9 rounded-2xl">
                        <i class="fa-solid fa-sliders text-xs"></i>
                    </button>

                </div>

            </div>

            <!-- STORIES -->

            <div class="px-4">

                <div class="flex items-center justify-between mb-1">

                    <span class="text-[10px] font-extrabold uppercase tracking-wider">
                        Hikoyalar
                    </span>

                    <button onclick="openStoryModal()"
                    class="text-blue-400 text-[10px] font-bold">
                        + Hikoya
                    </button>

                </div>

                <div id="storyStrip" class="story-strip"></div>

            </div>

            <!-- SEARCH -->

            <div class="px-4 pb-3">

                <div class="glass rounded-2xl flex items-center px-3">

                    <i class="fa-solid fa-magnifying-glass
                    text-[var(--muted)] text-xs"></i>

                    <input id="searchInput"
                    oninput="renderChatList()"
                    class="bg-transparent outline-none flex-1 px-3 py-3 text-xs"
                    placeholder="Qidirish...">

                </div>

            </div>

            <!-- ACTIONS -->

            <div class="px-4 pb-3 flex gap-2">

                <button onclick="openAddFriendModal()"
                class="glass-btn rounded-2xl px-3 py-2 text-[10px] font-bold">
                    <i class="fa-solid fa-user-plus mr-1"></i>
                    Do'st
                </button>

                <button onclick="openCreateModal('group')"
                class="glass-btn rounded-2xl px-3 py-2 text-[10px] font-bold">
                    <i class="fa-solid fa-users mr-1"></i>
                    Guruh
                </button>

                <button onclick="openCreateModal('channel')"
                class="glass-btn rounded-2xl px-3 py-2 text-[10px] font-bold">
                    <i class="fa-solid fa-bullhorn mr-1"></i>
                    Kanal
                </button>

            </div>

            <!-- FOLDERS -->

            <div id="folderTabs"
            class="px-4 flex gap-2 overflow-x-auto pb-2">

                <button onclick="switchFolder('all',event)"
                class="glass-btn rounded-full px-3 py-1.5 text-[9px] font-bold text-blue-400">
                    Barchasi
                </button>

                <button onclick="switchFolder('friends',event)"
                class="glass-btn rounded-full px-3 py-1.5 text-[9px] font-bold">
                    Do'stlar
                </button>

                <button onclick="switchFolder('groups',event)"
                class="glass-btn rounded-full px-3 py-1.5 text-[9px] font-bold">
                    Guruhlar
                </button>

                <button onclick="switchFolder('channels',event)"
                class="glass-btn rounded-full px-3 py-1.5 text-[9px] font-bold">
                    Kanallar
                </button>

                <button onclick="switchFolder('bots',event)"
                class="glass-btn rounded-full px-3 py-1.5 text-[9px] font-bold">
                    Botlar
                </button>

            </div>

            <div id="chatList"
            class="flex-1 overflow-y-auto pb-3">
            </div>

        </aside>


        <!-- CHAT -->

        <main id="chatPanel"
        class="flex-1 h-full flex flex-col relative">

            <!-- HEADER -->

            <header class="p-3">

                <div class="glass rounded-[22px] px-4 py-2.5
                flex items-center justify-between">

                    <div class="flex items-center gap-3">

                        <button onclick="backToSidebar()"
                        class="glass-btn w-9 h-9 rounded-2xl md:hidden">
                            <i class="fa-solid fa-arrow-left text-xs"></i>
                        </button>

                        <div id="activeAvatar"
                        class="avatar3d w-10 h-10 min-w-10">
                            U
                        </div>

                        <div>
                            <div id="activeTitle"
                            class="font-extrabold text-xs">
                                Chat tanlanmagan
                            </div>

                            <div id="activeSubTitle"
                            class="text-[9px] text-[var(--muted)]">
                                Uzrel
                            </div>
                        </div>

                    </div>

                    <div class="flex gap-1">

                        <button onclick="triggerFireworks()"
                        class="glass-btn w-9 h-9 rounded-2xl text-yellow-400">
                            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                        </button>

                        <button onclick="openChatInfoModal()"
                        class="glass-btn w-9 h-9 rounded-2xl">
                            <i class="fa-solid fa-ellipsis text-xs"></i>
                        </button>

                    </div>

                </div>

            </header>


            <!-- MESSAGES -->

            <div id="messageContainer"
            class="flex-1 overflow-y-auto px-4 py-2">
            </div>


            <!-- STICKER PANEL -->

            <div id="stickerPicker"
            class="sticker-panel glass">

                <div class="flex justify-between items-center mb-2">
                    <span class="font-extrabold text-xs">
                        Stikerlar
                    </span>

                    <button onclick="toggleStickerPicker()"
                    class="text-[var(--muted)]">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div id="stickerGrid"
                class="sticker-grid">
                </div>

            </div>


            <!-- INPUT -->

            <div class="p-3">

                <div class="glass rounded-[25px] p-2 flex items-center gap-2">

                    <input type="file"
                    id="fileInput"
                    class="hidden"
                    onchange="handleFileUpload(event)">

                    <button onclick="document.getElementById('fileInput').click()"
                    class="glass-btn w-10 h-10 rounded-2xl">
                        <i class="fa-solid fa-paperclip text-xs"></i>
                    </button>

                    <button onclick="toggleStickerPicker()"
                    class="glass-btn w-10 h-10 rounded-2xl">
                        <i class="fa-regular fa-face-smile text-xs"></i>
                    </button>

                    <input id="msgInput"
                    class="bg-transparent outline-none flex-1 text-xs px-2"
                    placeholder="Xabar yozing..."
                    onkeydown="if(event.key==='Enter')sendMsg()">

                    <button onclick="sendMsg()"
                    class="w-11 h-11 rounded-2xl text-white
                    bg-gradient-to-br from-blue-600 via-purple-600 to-cyan-500
                    shadow-lg shadow-blue-500/20">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>

                </div>

            </div>

        </main>

    </div>
</div>


<!-- ================= MODALS ================= -->

<!-- STORY -->

<div id="storyModal" class="modal">

    <div class="modal-card glass">

        <div class="flex justify-between items-center mb-5">

            <h3 class="font-extrabold text-sm">
                Hikoya qo'shish
            </h3>

            <button onclick="closeModal('storyModal')"
            class="glass-btn w-8 h-8 rounded-xl">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>

        </div>

        <div class="space-y-3">

            <input id="storyCaption"
            class="field"
            placeholder="Hikoya matni...">

            <input id="storyImage"
            type="file"
            accept="image/*"
            class="field">

            <button onclick="publishStory()"
            class="w-full py-3 rounded-2xl
            bg-gradient-to-r from-blue-600 to-purple-600
            text-white text-xs font-extrabold">
                Hikoyani joylash
            </button>

        </div>

    </div>
</div>


<!-- SETTINGS -->

<div id="settingsModal" class="modal">

    <div class="modal-card glass">

        <div class="flex justify-between mb-5">

            <h3 class="font-extrabold">
                Profil sozlamalari
            </h3>

            <button onclick="closeModal('settingsModal')"
            class="glass-btn w-8 h-8 rounded-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="space-y-3">

            <input id="profileAvatarInput"
            class="field"
            placeholder="Avatar emoji">

            <input id="profileNameInput"
            class="field"
            placeholder="Ism">

            <input id="profileBioInput"
            class="field"
            placeholder="Bio">

            <button onclick="saveProfileChanges()"
            class="w-full py-3 rounded-2xl bg-blue-600 text-white text-xs font-bold">
                Saqlash
            </button>

            <div class="grid grid-cols-2 gap-2">

                <button onclick="setTheme('dark')"
                class="glass-btn rounded-2xl p-3 text-xs">
                    🌙 Dark
                </button>

                <button onclick="setTheme('amoled')"
                class="glass-btn rounded-2xl p-3 text-xs">
                    🖤 AMOLED
                </button>

            </div>

            <button onclick="logout()"
            class="w-full py-3 rounded-2xl
            bg-red-500/10 border border-red-500/20
            text-red-400 text-xs font-bold">
                Chiqish
            </button>

        </div>

    </div>
</div>


<!-- ADD FRIEND -->

<div id="addFriendModal" class="modal">

    <div class="modal-card glass">

        <h3 class="font-extrabold mb-4">

<script>

/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {
    apiKey:"AIzaSyDummyKeyForCompatModeToWork",
    authDomain:"uzrel-ceeed.firebaseapp.com",
    databaseURL:"https://uzrel-ceeed-default-rtdb.firebaseio.com",
    projectId:"uzrel-ceeed",
    storageBucket:"uzrel-ceeed.appspot.com",
    messagingSenderId:"000000000000",
    appId:"1:000000000000:web:0000000000000000"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();


/* =========================================
   STATE
========================================= */

let currentUser=localStorage.getItem("uzrel_current_user");
let activeUserData=null;
let allCloudUsers={};
let globalRooms={};
let activeChatId=null;
let currentFolder="all";
let authMode="login";
let createModalType=null;


/* =========================================
   STICKERS
========================================= */

const STICKERS=[
"😀","😂","🤣","😎","🤩",
"🥳","🔥","❤️","💙","💜",
"👍","👎","👏","🙏","💯",
"🚀","🎉","🎆","🇺🇿","⭐",
"😈","🤖","👑","🫡","😱",
"😭","🤣","😴","🤝","✨"
];

function renderStickerPicker(){

    const grid=document.getElementById("stickerGrid");

    grid.innerHTML="";

    STICKERS.forEach(s=>{

        const div=document.createElement("div");

        div.className="sticker";
        div.textContent=s;

        div.onclick=()=>{
            sendSticker(s);
        };

        grid.appendChild(div);

    });
}


/* =========================================
   START
========================================= */

window.onload=()=>{

    renderStickerPicker();

    if(currentUser){

        initFirebaseListeners();

    }

};


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   AUTH
========================================= */

function switchAuthMode(mode){

    authMode=mode;

    document.getElementById("errorMsg")
    .classList.add("hidden");

    const login=document.getElementById("tabLoginBtn");
    const reg=document.getElementById("tabRegisterBtn");
    const birth=document.getElementById("birthdateInput");
    const btn=document.getElementById("authActionBtn");

    login.className=
    "flex-1 py-2.5 rounded-xl text-xs font-bold";

    reg.className=
    "flex-1 py-2.5 rounded-xl text-xs font-bold";

    if(mode==="login"){

        login.classList.add("bg-blue-600","text-white");

        birth.classList.add("hidden");

        btn.innerText="Akkauntga kirish";

    }else{

        reg.classList.add("bg-blue-600","text-white");

        birth.classList.remove("hidden");

        btn.innerText="Ro'yxatdan o'tish";

    }

}


function handleAuth(){

    const name=document.getElementById("usernameInput")
    .value.trim().toLowerCase();

    const pass=document.getElementById("passwordInput").value;

    const birth=document.getElementById("birthdateInput").value;

    const error=document.getElementById("errorMsg");

    if(!name||!pass){

        error.innerText="Username va parolni kiriting!";
        error.classList.remove("hidden");
        return;

    }

    db.ref("users/"+name).once("value",snap=>{

        const user=snap.val();

        if(authMode==="login"){

            if(!user){

                error.innerText="Akkaunt topilmadi!";
                error.classList.remove("hidden");
                return;

            }

            if(user.password!==pass){

                error.innerText="Parol noto'g'ri!";
                error.classList.remove("hidden");
                return;

            }

        }else{

            if(!birth){

                error.innerText="Tug'ilgan kunni kiriting!";
                error.classList.remove("hidden");
                return;

            }

            if(user){

                error.innerText="Username band!";
                error.classList.remove("hidden");
                return;

            }

            db.ref("users/"+name).set({

                password:pass,
                birthdate:birth,
                avatar:name[0].toUpperCase(),
                displayName:name,
                bio:"",
                stories:{},

                chats:{

                    saved_messages:{
                        id:"saved_messages",
                        name:"Saqlangan xabarlar",
                        type:"saved",
                        icon:"🔖",
                        messages:{
                            m1:{
                                sender:"other",
                                text:"Uzrel'ga xush kelibsiz! 🚀",
                                time:"12:00",
                                type:"text"
                            }
                        }
                    },

                    bot_father:{
                        id:"bot_father",
                        name:"BotFather",
                        type:"bots",
                        icon:"🤖",
                        bot:true,
                        messages:{
                            m1:{
                                sender:"other",
                                text:"Bot yaratish uchun /newbot yuboring.",
                                time:"12:00",
                                type:"text",
                                keyboard:true
                            }
                        }
                    }

                }

            });

        }

        currentUser=name;

        localStorage.setItem(
            "uzrel_current_user",
            name
        );

        initFirebaseListeners();

        triggerFireworks();

    });

}


/* =========================================
   FIREBASE LISTENERS
========================================= */

function initFirebaseListeners(){

    db.ref("users").on("value",snap=>{

        allCloudUsers=snap.val()||{};

        if(!allCloudUsers[currentUser]){

            logout();
            return;

        }

        activeUserData=allCloudUsers[currentUser];

        document.getElementById("authScreen")
        .style.display="none";

        document.getElementById("appScreen")
        .classList.remove("hidden");

        updateMyProfile();

        renderChatList();

        renderStories();

        if(activeChatId)
            renderMessages();

    });


    db.ref("globalChats").on("value",snap=>{

        globalRooms=snap.val()||{};

        renderChatList();

        if(activeChatId)
            renderMessages();

    });

}


/* =========================================
   PROFILE
========================================= */

function updateMyProfile(){

    if(!activeUserData)return;

    const avatar=
    activeUserData.avatar ||
    currentUser[0].toUpperCase();

    document.getElementById("myAvatar")
    .childNodes[0].textContent=avatar;

    document.getElementById("myName").innerText=
    activeUserData.displayName||currentUser;

    document.getElementById("myUsername").innerText=
    "@"+currentUser;

}


function openSettingsModal(){

    document.getElementById("profileAvatarInput").value=
    activeUserData.avatar||"";

    document.getElementById("profileNameInput").value=
    activeUserData.displayName||currentUser;

    document.getElementById("profileBioInput").value=
    activeUserData.bio||"";

    openModal("settingsModal");

}


function saveProfileChanges(){

    const avatar=
    document.getElementById("profileAvatarInput").value.trim();

    const name=
    document.getElementById("profileNameInput").value.trim();

    const bio=
    document.getElementById("profileBioInput").value.trim();

    db.ref("users/"+currentUser).update({

        avatar:avatar||currentUser[0].toUpperCase(),
        displayName:name||currentUser,
        bio:bio

    });

    closeModal("settingsModal");

}


/* =========================================
   STORIES
========================================= */

function renderStories(){

    const strip=document.getElementById("storyStrip");

    if(!strip)return;

    strip.innerHTML="";

    /* MY STORY */

    const mine=document.createElement("div");

    mine.className="story";

    mine.innerHTML=`

        <div class="story-avatar add-story">

            <div class="story-avatar-inner">
                ${escapeHTML(
                    activeUserData?.avatar||
                    currentUser?.[0]?.toUpperCase()||
                    "U"
                )}
            </div>

        </div>

        <div class="story-name">Mening story</div>

    `;

    mine.onclick=()=>{

        const stories=activeUserData?.stories||{};
        const arr=Object.values(stories);

        if(arr.length)
            openStory(arr[arr.length-1]);
        else
            openStoryModal();

    };

    strip.appendChild(mine);


    /* USERS */

    Object.entries(allCloudUsers).forEach(([username,user])=>{

        if(username===currentUser)return;

        const stories=user.stories||{};
        const arr=Object.values(stories);

        if(!arr.length)return;

        const latest=arr[arr.length-1];

        const item=document.createElement("div");

        item.className="story";

        item.innerHTML=`

            <div class="story-avatar">

                <div class="story-avatar-inner">

                    ${
                        latest.image
                        ? `<img src="${latest.image}">`
                        : escapeHTML(user.avatar||username[0].toUpperCase())
                    }

                </div>

            </div>

            <div class="story-name">
                ${escapeHTML(user.displayName||username)}
            </div>

        `;

        item.onclick=()=>openStory(latest);

        strip.appendChild(item);

    });

}


/* =========================================
   PUBLISH STORY
========================================= */

function openStoryModal(){

    document.getElementById("storyCaption").value="";
    document.getElementById("storyImage").value="";

    openModal("storyModal");

}


function publishStory(){

    const caption=
    document.getElementById("storyCaption").value.trim();

    const file=
    document.getElementById("storyImage").files[0];

    if(!caption&&!file){

        alert("Rasm yoki matn qo'shing!");
        return;

    }

    if(file){

        if(file.size>2*1024*1024){

            alert("Rasm 2 MB dan kichik bo'lsin.");
            return;

        }

        const reader=new FileReader();

        reader.onload=e=>{

            saveStory(caption,e.target.result);

        };

        reader.readAsDataURL(file);

    }else{

        saveStory(caption,"");

    }

}


function saveStory(caption,image){

    const story={

        id:Date.now(),
        caption,
        image,
        time:new Date().toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
        )

    };

    db.ref(
        "users/"+currentUser+"/stories/"+story.id
    ).set(story);

    closeModal("storyModal");

    triggerFireworks();

}


/* =========================================
   STORY VIEWER
========================================= */

function openStory(story){

    const viewer=document.getElementById("storyViewer");
    const img=document.getElementById("storyViewImage");
    const text=document.getElementById("storyViewText");

    if(story.image){

        img.src=story.image;
        img.classList.remove("hidden");

    }else{

        img.classList.add("hidden");

    }

    text.innerText=story.caption||"";

    viewer.classList.add("open");

}


/* =========================================
   CHATS
========================================= */

function getChats(){

    return activeUserData?.chats||{};

}


function switchFolder(folder,e){

    currentFolder=folder;

    document.querySelectorAll("#folderTabs button")
    .forEach(b=>b.classList.remove("text-blue-400"));

    e.currentTarget.classList.add("text-blue-400");

    renderChatList();

}


function renderChatList(){

    const list=document.getElementById("chatList");

    if(!list||!activeUserData)return;

    list.innerHTML="";

    const query=
    document.getElementById("searchInput")
    .value.toLowerCase().trim();

    Object.values(getChats()).forEach(chat=>{

        if(query &&
        !chat.name.toLowerCase().includes(query))
            return;

        if(currentFolder==="friends"&&chat.type!=="friend")
            return;

        if(currentFolder==="groups"&&chat.type!=="group")
            return;

        if(currentFolder==="channels"&&chat.type!=="channel")
            return;

        if(currentFolder==="bots"&&chat.type!=="bots")
            return;

        let messages=[];

        if(chat.type==="friend"){

            const key=[
                currentUser,
                chat.targetUser
            ].sort().join("_");

            if(globalRooms[key])
                messages=Object.values(globalRooms[key]);

        }else if(chat.messages){

            messages=Object.values(chat.messages);

        }

        const last=messages.at(-1);

        const preview=last
        ? last.type==="image"
            ? "📷 Rasm"
            : last.type==="sticker"
            ? last.text
            : last.text
        : "Xabarlar yo'q";

        const item=document.createElement("div");

        item.className=
        "chat-item"+
        (activeChatId===chat.id?" active":"");

        item.innerHTML=`

            <div class="avatar3d">

                ${escapeHTML(
                    chat.icon||
                    chat.name[0].toUpperCase()
                )}

                ${
                    chat.type==="friend"
                    ? '<span class="online-dot"></span>'
                    :""
                }

            </div>

            <div class="flex-1 min-w-0">

                <div class="flex justify-between">

                    <div class="font-extrabold text-xs truncate">
                        ${escapeHTML(chat.name)}
                    </div>

                    ${
                        last
                        ? `<span class="text-[8px] text-[var(--muted)]">
                            ${escapeHTML(last.time)}
                           </span>`
                        :""
                    }

                </div>

                <div class="text-[10px] text-[var(--muted)]
                truncate mt-1">
                    ${escapeHTML(preview)}
                </div>

            </div>

        `;

        item.onclick=()=>selectChat(chat.id);

        list.appendChild(item);

    });

}


function selectChat(id){

    activeChatId=id;

    const chat=getChats()[id];

    if(!chat)return;

    document.getElementById("activeTitle").innerText=
    chat.name;

    document.getElementById("activeAvatar").innerText=
    chat.icon||chat.name[0].toUpperCase();

    document.getElementById("activeSubTitle").innerText=
    chat.type==="friend"
    ? "onlayn"
    : chat.type==="bots"
    ? "Bot"
    : chat.type;

    renderMessages();

    renderChatList();

    if(window.innerWidth<=768){

        document.getElementById("sidebarPanel")
        .classList.add("hidden");

    }

}


/* =========================================
   MESSAGES
========================================= */

function renderMessages(){

    const box=document.getElementById("messageContainer");

    box.innerHTML="";

    const chat=getChats()[activeChatId];

    if(!chat)return;

    let messages=[];

    if(chat.type==="friend"){

        const key=[
            currentUser,
            chat.targetUser
        ].sort().join("_");

        if(globalRooms[key])
            messages=Object.values(globalRooms[key]);

    }else{

        messages=Object.values(chat.messages||{});

    }

    messages.forEach(m=>{

        const me=
        m.sender===currentUser||
        m.sender==="me";

        const row=document.createElement("div");

        row.className=
        "message-row "+(me?"me":"");

        const bubble=document.createElement("div");

        bubble.className=
        "message-bubble "+(me?"me":"other");

        let content="";

        if(m.type==="image"){

            content=`
            <img src="${m.text}"
            style="max-width:280px;max-height:300px;
            border-radius:14px;display:block">
            `;

        }else if(m.type==="sticker"){

            content=`
            <div style="font-size:52px">
                ${escapeHTML(m.text)}
            </div>
            `;

        }else{

            content=
            `<div style="font-size:11px;line-height:1.55">
                ${escapeHTML(m.text)}
             </div>`;

        }

        let keyboard="";

        if(m.keyboard){

            keyboard=`

            <div class="bot-keyboard">

                <button onclick="botButton('/newbot')">
                    ➕ Create a new bot
                </button>

                <button onclick="botButton('/mybots')">
                    🤖 My Bots
                </button>

                <button onclick="botButton('/setname')">
                    ✏️ Edit Name
                </button>

                <button onclick="botButton('/setuserpic')">
                    🖼️ Edit Picture
                </button>

                <button onclick="botButton('/setdescription')">
                    📝 Description
                </button>

                <button onclick="botButton('/help')">
                    ❓ Help
                </button>

            </div>

            `;

        }

        bubble.innerHTML=
        content+
        keyboard+
        `<div class="message-time">
            ${escapeHTML(m.time||"")}
            ${me?" ✓✓":""}
        </div>`;

        row.appendChild(bubble);

        box.appendChild(row);

    });

    box.scrollTop=box.scrollHeight;

}


/* =========================================
   SEND MESSAGE
========================================= */

function sendMsg(){

    const input=document.getElementById("msgInput");

    const text=input.value.trim();

    if(!text||!activeChatId)return;

    /*
       YASHIRIN UZREO
    */

    if(processUzreo(text)){

        input.value="";
        return;

    }

    dispatchMessage({
        type:"text",
        content:text
    });

    input.value="";

}


function sendSticker(emoji){

    document.getElementById("stickerPicker")
    .classList.remove("open");

    dispatchMessage({
        type:"sticker",
        content:emoji
    });

}


function dispatchMessage(data){

    const chat=getChats()[activeChatId];

    if(!chat)return;

    const message={

        sender:currentUser,
        type:data.type,
        text:data.content,
        time:new Date().toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
        )

    };

    if(chat.type==="friend"){

        const key=[
            currentUser,
            chat.targetUser
        ].sort().join("_");

        db.ref("globalChats/"+key).push(message);

    }else{

        db.ref(
            `users/${currentUser}/chats/${activeChatId}/messages`
        ).push(message);

    }

}


/* =========================================
   FILE
========================================= */

function handleFileUpload(event){

    const file=event.target.files[0];

    if(!file||!activeChatId)return;

    if(!file.type.startsWith("image/")){

        alert("Hozircha faqat rasm yuborish qo'llab-quvvatlanadi.");
        return;

    }

    if(file.size>2*1024*1024){

        alert("Rasm 2 MB dan kichik bo'lsin.");
        return;

    }

    const reader=new FileReader();

    reader.onload=e=>{

        dispatchMessage({

            type:"image",
            content:e.target.result

        });

    };

    reader.readAsDataURL(file);

    event.target.value="";

}

   STICKER
========================================= */

function toggleStickerPicker(){

    document.getElementById("stickerPicker")
    .classList.toggle("open");

}

   ADD FRIEND

    openModal("addFriendModal");

}


function confirmAddFriend(){

    const target=
    document.getElementById(
        "friendUsernameInput"
    ).value.trim().toLowerCase();

    const first=
    document.getElementById(
        "friendFirstMsgInput"
    ).value.trim()||"Salom!";

    if(!target||target===currentUser)return;

    if(!allCloudUsers[target]){

        alert("Foydalanuvchi topilmadi!");
        return;

    }

    const id="friend_"+target;

    db.ref(
        `users/${currentUser}/chats/${id}`
    ).set({

        id,
        name:target,
        type:"friend",
        targetUser:target,
        icon:
        allCloudUsers[target].avatar||
        target[0].toUpperCase()

    });

    db.ref(
        `users/${target}/chats/friend_${currentUser}`
    ).set({

        id:"friend_"+currentUser,
        name:currentUser,
        type:"friend",
        targetUser:currentUser,
        icon:
        activeUserData.avatar||
        currentUser[0].toUpperCase()

    });

    const room=[
        currentUser,
        target
    ].sort().join("_");

    db.ref("globalChats/"+room).push({

        sender:currentUser,
        type:"text",
        text:first,
        time:new Date().toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
        )

    });

    closeModal("addFriendModal");

}


/* =========================================
   GROUP / CHANNEL
========================================= */

function openCreateModal(type){

    createModalType=type;

    document.getElementById(

    ).innerText=
    type==="group"

function confirmCreate(){

                createModalType==="group"

                    [],
                    {hour:"2-digit",minute:"2-digit"}
                )
            }

        }

    });

    closeModal("createModal");

}

   BOT
========================================= */

function botButton(command){

    if(!activeChatId)return;

    if(command==="/newbot"){

        createBot();

        return;

    }

    if(command==="/mybots"){

        botReply(
            "🤖 Sizning botlaringizni shu yerda boshqarishingiz mumkin."
        );

        return;

    }

    if(command==="/setname"){

        botReply(
            "✏️ Bot nomini o'zgartirish uchun /setname buyrug'idan foydalaning."
        );

        return;

    }

    if(command==="/setuserpic"){

        botReply(
            "🖼️ Bot rasmi uchun /setuserpic buyrug'idan foydalaning."
        );

        return;

    }

    if(command==="/setdescription"){

        botReply(
            "📝 Bot description'ini sozlash mumkin."
        );

        return;

    }

    if(command==="/help"){

        botReply(
            "❓ BotFather yordam menyusi."
        );

    }

}


function createBot(){

    const name=prompt(
        "Bot nomini kiriting:"
    );

    if(!name)return;

    const username=prompt(
        "Bot username'ini kiriting:"
    );

    if(!username)return;

    const id="bot_"+Date.now();

    const bot={

        id,
        name,
        username,
        type:"bots",
        icon:"🤖",
        bot:true,

        messages:{

            welcome:{
                sender:"other",
                type:"text",
                text:
                `🤖 ${name} yaratildi!\n\nUsername: @${username}`,
                time:new Date().toLocaleTimeString(
                    [],
                    {hour:"2-digit",minute:"2-digit"}
                )
            }

        }

    };

    db.ref(
        `users/${currentUser}/chats/${id}`
    ).set(bot);

    setTimeout(()=>selectChat(id),300);

}


function botReply(text){

    const chat=getChats()[activeChatId];

    if(!chat)return;

    db.ref(
        `users/${currentUser}/chats/${activeChatId}/messages`
    ).push({

        sender:"other",
        type:"text",
        text,
        time:new Date().toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
        )

    });

}


/* =========================================
   GROUP PROFILE / SETTINGS
========================================= */

function openChatInfoModal(){

    const chat=getChats()[activeChatId];

    if(!chat)return;

    document.getElementById(
        "chatInfoTitle"
    ).innerText=chat.name;

    const content=
    document.getElementById(
        "chatInfoContent"
    );

    content.innerHTML=`

        <div class="text-center">

            <div class="avatar3d mx-auto mb-3"
            style="width:75px;height:75px;font-size:25px">
                ${escapeHTML(chat.icon||"👥")}
            </div>

            <div class="font-extrabold text-sm">
                ${escapeHTML(chat.name)}
            </div>

            <div class="text-[10px]
            text-[var(--muted)] mt-1">
                ${escapeHTML(chat.type)}
            </div>

        </div>

        ${
            chat.type==="group"
            ? `

            <div class="mt-5 space-y-2">

                <button onclick="editGroup()"
                class="glass-btn w-full p-3 rounded-2xl text-left text-xs">
                    ✏️ Guruhni tahrirlash
                </button>

                <button onclick="openStoryModal()"
                class="glass-btn w-full p-3 rounded-2xl text-left text-xs">
                    📸 Guruh profiliga hikoya qo'shish
                </button>

                <button onclick="botReply('🔕 Guruh ovozsiz qilindi.')"
                class="glass-btn w-full p-3 rounded-2xl text-left text-xs">
                    🔕 Mute
                </button>

            </div>

            `
            :""
        }

        ${
            chat.type==="bots"
            ? `

            <div class="mt-5 space-y-2">

                <button onclick="createBot()"
                class="glass-btn w-full p-3 rounded-2xl text-left text-xs">
                    🤖 Yangi bot
                </button>

                <button onclick="botReply('⚙️ Bot sozlamalari ochildi.')"
                class="glass-btn w-full p-3 rounded-2xl text-left text-xs">
                    ⚙️ Bot sozlamalari
                </button>

            </div>

            `
            :""
        }

    `;

    openModal("chatInfoModal");

}


function editGroup(){

    const chat=getChats()[activeChatId];

    if(!chat)return;

    const name=prompt(
        "Yangi guruh nomi:",
        chat.name
    );

    if(!name)return;

    const icon=prompt(
        "Yangi emoji:",
        chat.icon||"👥"
    );

    db.ref(
        `users/${currentUser}/chats/${activeChatId}`
    ).update({

        name,
        icon:icon||chat.icon

    });

}


/* =========================================
   HIDDEN UZREO
========================================= */

function processUzreo(text){

    const lower=text.toLowerCase().trim();

    if(!lower.startsWith("/uzreo"))
        return false;

    const command=lower
    .replace("/uzreo","")
    .trim();

    if(command==="help"){

        botReply(
            "Uzreo yashirin yordamchi.\n\n"+
            "/uzreo dark — Dark rejim\n"+
            "/uzreo amoled — AMOLED\n"+
            "/uzreo fireworks — effekt\n"+
            "/uzreo stickers — stikerlar\n"+
            "/uzreo settings — sozlamalar"
        );

    }else if(command==="dark"){

        setTheme("dark");
        botReply("🌙 Dark rejim yoqildi.");

    }else if(command==="amoled"){

        setTheme("amoled");
        botReply("🖤 AMOLED rejim yoqildi.");

    }else if(command==="fireworks"){

        triggerFireworks();
        botReply("✨ Tayyor!");

    }else if(command==="stickers"){

        document.getElementById("stickerPicker")
        .classList.add("open");

    }else if(command==="settings"){

        openSettingsModal();

    }else{

        botReply(
            "Uzreo: buyruqni tushunmadim. /uzreo help"
        );

    }

    return true;

}


/* =========================================
   THEME
========================================= */

function setTheme(theme){

    if(theme==="amoled"){

        document.documentElement.style
        .setProperty("--bg","#000");

    }else{

        document.documentElement.style
        .setProperty("--bg","#05070c");

    }

    localStorage.setItem(
        "uzrel_theme",
        theme
    );

}


/* =========================================
   MODALS
========================================= */

function openModal(id){

    document.getElementById(id)
    .classList.add("open");

}


function closeModal(id){

    document.getElementById(id)
    .classList.remove("open");

}


/* =========================================
   MOBILE
========================================= */

function backToSidebar(){

    document.getElementById("sidebarPanel")
    .classList.remove("hidden");

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    localStorage.removeItem(
        "uzrel_current_user"
    );

    location.reload();

}


/* =========================================
   FIREWORKS
========================================= */

function triggerFireworks(){

    if(typeof confetti==="undefined")
        return;

    const canvas=
    document.getElementById(
        "confettiCanvas"
    );

    const fire=
    confetti.create(
        canvas,
        {
            resize:true,
            useWorker:true
        }
    );

    fire({

        particleCount:100,
        spread:110,
        origin:{y:.6}

    });

}


/* =========================================
   OUTSIDE CLICK
========================================= */

document.addEventListener("click",e=>{

    const picker=
    document.getElementById(
        "stickerPicker"
    );

    if(
        picker.classList.contains("open") &&
        !picker.contains(e.target) &&
        !e.target.closest(
            '[onclick="toggleStickerPicker()"]'
        )
    ){

        picker.classList.remove("open");

    }

});


document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        document.querySelectorAll(".modal.open")
        .forEach(m=>m.classList.remove("open"));

        document.getElementById(
            "stickerPicker"
        ).classList.remove("open");

        document.getElementById(
            "storyViewer"
        ).classList.remove("open");

    }

});

</script>
