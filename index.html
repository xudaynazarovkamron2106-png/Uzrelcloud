<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .uzrel-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <header class="p-4 uzrel-panel border-b border-[var(--border-color)] flex items-center justify-between">
        <h1 class="text-sm font-semibold text-white/90">Chat Assistant</h1>
    </header>

    <main id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">AI</div>
            <div class="uzrel-panel p-3 rounded-2xl rounded-tl-none border border-[var(--border-color)] max-w-[80%] text-xs leading-relaxed">
                Salom! Sizga qanday yordam bera olaman?
            </div>
        </div>
    </main>

    <footer class="p-4 pb-6 pt-2 z-10 w-full max-w-4xl mx-auto" id="chatInputArea">
        <div class="uzrel-panel p-2 sm:p-2.5 rounded-2xl border border-[var(--border-color)] flex items-center gap-2 shadow-2xl">
            <input type="file" id="fileInput" class="hidden" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('fileInput').click()" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 text-[var(--text-muted)] hover:text-white flex items-center justify-center flex-shrink-0 transition" title="Fayl">
                <i class="fa-solid fa-paperclip text-xs"></i>
            </button>

            <button onclick="toggleStickerPicker()" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 text-[var(--text-muted)] hover:text-white flex items-center justify-center flex-shrink-0 transition" title="Stiker">
                <i class="fa-regular fa-face-smile text-xs"></i>
            </button>

            <div class="flex-1 relative">
                <input type="text" id="msgInput" placeholder="Xabar yozing..." class="w-full bg-black/20 border border-[var(--border-color)] focus:border-blue-500 rounded-xl pl-4 pr-4 py-2.5 text-xs text-white placeholder-gray-400 focus:outline-none transition" onkeypress="if(event.key==='Enter') sendMsg()">
            </div>

            <button onclick="sendMsg()" class="w-9 h-9 rounded-xl bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center shadow-md flex-shrink-0 transition">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </footer>

    <script>
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');
            
            // Foydalanuvchi xabarini qo'shish
            const userMsgHtml = `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-blue-600 p-3 rounded-2xl rounded-tr-none max-w-[80%] text-xs leading-relaxed text-white shadow-md">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', userMsgHtml);
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                alert(`Fayl tanlandi: ${file.name}`);
            }
        }

        function toggleStickerPicker() {
            alert('Stikerlar paneli');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
